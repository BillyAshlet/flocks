<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flocks</title>
    <style>
      /* Warm neutrals: a light beige page, a slightly darker plate for the tank,
         and near-black ink. The only saturated colors on screen are the three
         species and the mechanism colors (mechanisms.js). */
      :root {
        color-scheme: light;
        --paper: #f8f5ee;
        --plate: #eee9df;
        --panel: #f3efe6;
        --ink: #141413;
        --ink-soft: #3d3a35;
        --muted: #716c62;
        --line: #e2dccf;
        --line-strong: #cbc3b3;
        --run-grey: #e6e0d3;
        --alert: #a3483c;
        --serif: "Source Serif 4 Variable", "Source Serif Pro", Georgia, serif;
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "SFMono-Regular", ui-monospace, Menlo, "Roboto Mono", monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }

      /* Three columns: the paper on the left, the tank in the middle, the
         parameters on the right. Nothing floats over the tank except its own
         small readouts, so the text never covers a fish. */
      #app {
        /* --paper-custom is set by dragging the paper's edge (main.js). */
        --paper-width: var(--paper-custom, clamp(380px, 32vw, 520px));
        --panel-width: 340px;
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: var(--paper-width) minmax(0, 1fr) var(--panel-width);
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas:
          "top top top"
          "paper stage panel";
      }
      #app[data-panel-collapsed="1"] {
        --panel-width: 40px;
      }
      #app[data-ui-hidden="1"] {
        --paper-width: 0px;
        --panel-width: 0px;
      }
      #app[data-ui-hidden="1"] :is(#topbar, #paper, #panel-column, #paper-resizer) {
        display: none;
      }
      /* Home, the overview and the outlook are for reading: no parameter
         panel and no live readout. Home gives the text column more room. */
      #app:is([data-page="home"], [data-chapter="intro"], [data-chapter="outlook"]) {
        --panel-width: 0px;
      }
      #app:is([data-page="home"], [data-chapter="intro"], [data-chapter="outlook"])
        :is(#panel-column, #experiment-dashboard) {
        display: none !important;
      }
      #app[data-page="home"] {
        --paper-width: var(--paper-custom, clamp(440px, 38vw, 620px));
      }

      /* Top bar: previous, the overview, six tiers and outlook, next. Every tier looks equally
         clickable; this is a table of contents, not a locked progression. */
      #topbar {
        grid-area: top;
        display: flex;
        height: 52px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }
      #topbar .brand {
        display: flex;
        align-items: center;
        padding: 0 20px;
        border-right: 1px solid var(--line);
        color: var(--ink);
        font: 600 21px/1 var(--serif);
        text-decoration: none;
      }
      #tier-nav {
        flex: 1;
        display: flex;
        min-width: 0;
      }
      #tier-nav .edge {
        flex: none;
        padding: 0 16px;
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        font: 500 13px var(--sans);
        cursor: pointer;
      }
      #tier-nav .edge:hover:not(:disabled) {
        background: var(--plate);
      }
      #tier-nav .edge:disabled {
        color: var(--line-strong);
        cursor: default;
      }
      #tier-steps {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        margin: 0;
        padding: 0;
        border-inline: 1px solid var(--line);
        list-style: none;
      }
      #tier-steps li + li {
        border-left: 1px solid var(--line);
      }
      #tier-steps a {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 100%;
        padding: 0 12px;
        box-sizing: border-box;
        color: var(--ink-soft);
        font: 13px/1.2 var(--sans);
        text-decoration: none;
        overflow: hidden;
      }
      #tier-steps a .step-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #tier-steps a .step-number {
        flex: none;
        color: var(--muted);
        font: 11px/1 var(--mono);
      }
      #tier-steps a:hover {
        background: var(--plate);
      }
      #tier-steps a[aria-current="page"] {
        background: var(--ink);
        color: var(--paper);
      }
      #tier-steps a[aria-current="page"] .step-number {
        color: var(--line-strong);
      }

      /* The paper: what was added, why, what to watch, and the model. */
      /* Drag the paper's right edge to widen it for long formulas;
         double-click to reset. */
      #paper-resizer {
        position: absolute;
        top: 52px;
        bottom: 0;
        left: calc(var(--paper-width) - 4px);
        z-index: 6;
        width: 8px;
        cursor: col-resize;
        touch-action: none;
      }
      #paper-resizer::after {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 3px;
        width: 2px;
        background: transparent;
        content: "";
        transition: background 120ms ease;
      }
      #paper-resizer:hover::after,
      #app[data-resizing="1"] #paper-resizer::after {
        background: var(--line-strong);
      }
      #app[data-resizing="1"] {
        cursor: col-resize;
        user-select: none;
      }
      #paper {
        grid-area: paper;
        min-height: 0;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 34px 36px 96px;
        border-right: 1px solid var(--line);
        color: var(--ink);
        font: 16.5px/1.65 var(--serif);
      }
      #paper .eyebrow {
        margin: 0;
        color: var(--muted);
        font: 600 11px/1.4 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #paper h1 {
        margin: 6px 0 20px;
        font: 600 32px/1.15 var(--serif);
      }
      #paper h2 {
        margin: 36px 0 10px;
        color: var(--muted);
        font: 650 11.5px/1.4 var(--sans);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #paper h3 {
        margin: 26px 0 6px;
        font: 600 17px/1.4 var(--serif);
      }
      #paper p {
        margin: 0 0 14px;
      }
      #paper .added {
        font-size: 19px;
        line-height: 1.45;
      }
      #paper .watch {
        margin: 0;
        padding-left: 14px;
        border-left: 2px solid var(--ink);
      }
      #paper .placeholder {
        color: var(--muted);
        font-style: italic;
      }
      #paper .draft-note {
        margin: 0 0 16px;
        padding: 7px 10px;
        border-left: 2px solid #b58a4a;
        background: #f3ecdf;
        color: #6b5230;
        font: 12.5px/1.5 var(--sans);
      }
      #paper .note {
        color: var(--muted);
        font: 13px/1.5 var(--sans);
      }
      #paper ul {
        margin: 0 0 14px;
        padding-left: 20px;
      }
      #paper li + li {
        margin-top: 6px;
      }
      #paper .formula {
        margin: 10px 0 16px;
        padding: 2px 0;
        overflow-x: auto;
        overflow-y: hidden;
      }
      #paper .katex {
        font-size: 1em;
      }
      #paper .variables {
        width: 100%;
        margin: 8px 0 18px;
        border-collapse: collapse;
        font: 13.5px/1.45 var(--sans);
      }
      #paper .variables th {
        padding: 0 8px 6px 0;
        color: var(--muted);
        font: 600 11px var(--sans);
        letter-spacing: 0.06em;
        text-align: left;
        text-transform: uppercase;
      }
      #paper .variables td {
        padding: 6px 8px 6px 0;
        border-top: 1px solid var(--line);
        vertical-align: top;
      }
      #paper .variables td.value {
        font: 12.5px var(--mono);
        white-space: nowrap;
      }
      /* Values from the running simulation under a formula. A value that
         changes lights up for a moment. */
      /* Under each formula group: every symbol with its name, what it is, and
         its value now. */
      #paper .where {
        width: 100%;
        margin: 2px 0 18px;
        border-collapse: collapse;
        font: 13px/1.45 var(--sans);
      }
      #paper .where td {
        padding: 5px 8px 5px 0;
        border-top: 1px solid var(--line);
        vertical-align: baseline;
      }
      #paper .where tr:last-child td {
        border-bottom: 1px solid var(--line);
      }
      #paper .where-symbol {
        width: 1%;
        white-space: nowrap;
        font-size: 15px;
      }
      #paper .where-name {
        margin-right: 6px;
        color: var(--ink);
        font-weight: 600;
      }
      #paper .where-meaning {
        color: var(--muted);
      }
      #paper .where-value {
        width: 1%;
        padding-right: 0;
        text-align: right;
        white-space: nowrap;
        font: 12.5px var(--mono);
      }
      #paper .live {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 14px;
        margin: -4px 0 16px;
        padding: 7px 10px;
        border-radius: 3px;
        background: var(--plate);
        font: 12.5px/1.5 var(--mono);
      }
      #paper .live-label {
        color: var(--muted);
        font: 650 10.5px var(--sans);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #paper .live-item {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        white-space: nowrap;
      }
      #paper .live-symbol .katex {
        font-size: 1.05em;
      }
      #paper .live-equals {
        color: var(--muted);
      }
      #paper .live-value {
        padding: 0 3px;
        border-radius: 2px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #paper .live-value.glow {
        animation: live-glow 1.4s ease-out;
      }
      @keyframes live-glow {
        0% {
          background: #f6d77a;
          box-shadow: 0 0 10px 2px rgba(246, 200, 90, 0.75);
        }
        100% {
          background: transparent;
          box-shadow: 0 0 0 0 rgba(246, 200, 90, 0);
        }
      }
      /* Symbols linked to a slider: bold on a soft marker highlight, so every
         adjustable quantity reads as a control. Clicking one opens the slider
         and turns it the color of its mechanism (and its panel folder). */
      #paper [data-param] {
        padding: 0 0.12em;
        border-radius: 3px;
        background: rgba(214, 170, 82, 0.2);
        cursor: pointer;
        transition:
          background 150ms ease,
          color 150ms ease;
      }
      #paper [data-param],
      #paper [data-param] * {
        font-weight: 700;
      }
      #paper [data-param]:hover {
        background: rgba(214, 170, 82, 0.38);
      }
      #paper [data-param].is-active {
        color: var(--mech-color, var(--ink));
        background: color-mix(in srgb, var(--mech-color, var(--ink)) 16%, transparent);
        box-shadow: inset 0 -2px 0 var(--mech-color, var(--ink));
      }
      /* KaTeX stacks subscripts, fractions and sum limits in transparent
         positioned boxes (.vlist), and those boxes sit on top of some
         symbols: a click on R_s under a sum landed on an empty box and opened
         nothing. The formula ignores the pointer except on linked symbols. */
      #paper .katex-html,
      #paper .katex-html * {
        pointer-events: none;
      }
      #paper .katex-html [data-param],
      #paper .katex-html [data-param] * {
        pointer-events: auto;
      }

      /* The tank. */
      #stage {
        grid-area: stage;
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: var(--plate);
      }
      #stage > canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      #lab-reset {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 3;
        padding: 6px 11px;
        border: 1px solid var(--line-strong);
        background: var(--paper);
        color: var(--ink-soft);
        font: 500 12px var(--sans);
        cursor: pointer;
      }
      #lab-reset:hover {
        border-color: var(--muted);
        color: var(--ink);
      }
      #lab-reset[hidden] {
        display: none;
      }
      #time-shortcut-hud {
        position: absolute;
        top: 12px;
        left: 50%;
        z-index: 3;
        display: flex;
        gap: 12px;
        transform: translateX(-50%);
        padding: 5px 10px;
        border: 1px solid var(--line);
        background: rgba(248, 245, 238, 0.9);
        color: var(--muted);
        font: 11px var(--mono);
        letter-spacing: 0.04em;
        white-space: nowrap;
        pointer-events: none;
      }
      #startup-status {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 20;
        transform: translate(-50%, -50%);
        padding: 12px 18px;
        border: 1px solid var(--line-strong);
        background: var(--paper);
        color: var(--ink-soft);
        font: 13px var(--sans);
        pointer-events: none;
      }
      #startup-status[data-state="error"] {
        border-color: var(--alert);
        color: var(--alert);
      }
      #experiment-dashboard {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 4;
        width: min(360px, calc(100% - 24px));
        border: 1px solid var(--line);
        background: rgba(248, 245, 238, 0.92);
        color: var(--ink-soft);
        pointer-events: none;
        transition:
          opacity 180ms ease,
          transform 220ms ease;
      }
      #experiment-dashboard header {
        display: flex;
        justify-content: space-between;
        padding: 7px 9px 3px;
        font: 10px var(--mono);
        letter-spacing: 0.1em;
      }
      #experiment-dashboard header strong {
        color: var(--alert);
      }
      #experiment-metrics {
        margin: 0;
        padding: 4px 9px 9px;
        max-height: 160px;
        overflow: hidden;
        font: 10px/1.45 var(--mono);
        white-space: pre-wrap;
      }
      #app[data-selected-fish] #experiment-dashboard {
        opacity: 0;
        transform: translateY(calc(100% + 18px));
      }
      #fish-inspector {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 8;
        width: min(330px, calc(100% - 24px));
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--ink-soft);
        font: 11px/1.4 var(--sans);
        box-shadow: 0 14px 38px rgba(20, 20, 19, 0.12);
        transition:
          opacity 180ms ease,
          transform 220ms ease;
      }
      #fish-inspector[hidden] {
        display: none;
      }
      #fish-inspector header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 30px;
        padding: 0 9px 0 11px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }
      #fish-inspector .fish-inspector-index {
        color: var(--muted);
        font: 9px var(--mono);
        letter-spacing: 0.12em;
      }
      #fish-inspector-close {
        width: 25px;
        height: 25px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: 17px/1 var(--sans);
        cursor: pointer;
      }
      #fish-preview-viewport {
        position: relative;
        height: 154px;
        border-bottom: 1px solid var(--line);
        background: transparent;
        pointer-events: none;
        overflow: hidden;
      }
      #fish-preview-viewport > span {
        position: absolute;
        top: 8px;
        right: 9px;
        z-index: 1;
        padding: 3px 5px;
        background: rgba(20, 20, 19, 0.6);
        color: var(--paper);
        font: 8px var(--mono);
        letter-spacing: 0.1em;
      }
      .fish-inspector-copy {
        display: grid;
        gap: 2px;
        padding: 9px 11px 7px;
        background: var(--paper);
      }
      .fish-inspector-copy strong {
        color: var(--ink);
        font-size: 13px;
      }
      .fish-inspector-copy span {
        color: var(--muted);
        font-size: 10px;
      }
      .fish-inspector-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        border-top: 1px solid var(--line);
        background: var(--line);
      }
      .fish-inspector-actions button {
        min-height: 38px;
        padding: 7px;
        border: 0;
        background: var(--panel);
        color: var(--ink-soft);
        font: 11px/1.35 var(--sans);
        cursor: pointer;
      }
      .fish-inspector-actions button:first-child {
        background: var(--run-grey);
        color: var(--ink);
        font-weight: 600;
      }
      .fish-inspector-actions button:hover {
        background: var(--paper);
      }
      #fish-view-hud {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 9;
        display: grid;
        gap: 2px;
        min-width: 180px;
        padding: 8px 10px;
        border-left: 3px solid var(--ink);
        background: rgba(248, 245, 238, 0.9);
        color: var(--ink-soft);
        pointer-events: none;
      }
      #fish-view-hud[hidden] {
        display: none;
      }
      #fish-view-hud span {
        color: var(--muted);
        font: 9px var(--mono);
        letter-spacing: 0.12em;
      }
      #fish-view-hud strong {
        font-size: 13px;
      }
      #fish-view-hud kbd {
        margin-top: 3px;
        color: var(--alert);
        font: 9px/1.4 var(--mono);
      }
      #app:is([data-camera-mode="closeup"], [data-camera-mode="follow"])
        :is(#experiment-dashboard, #fish-inspector, #lab-reset) {
        opacity: 0;
        pointer-events: none;
      }
      /* Home page, in the paper column (home.js). */
      #paper .home-header {
        margin: 18px 0 8px;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--line);
      }
      #paper .home-title {
        margin: 0 0 14px;
        font: 600 56px/1 var(--serif);
        letter-spacing: -0.01em;
      }
      #paper .home-tagline {
        margin: 0 0 22px;
        color: var(--ink-soft);
        font: 22px/1.4 var(--serif);
      }
      #paper .home-byline {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 10px;
        margin: 0 0 2px;
        font: 600 17px/1.4 var(--serif);
      }
      #paper .home-author-native {
        color: var(--muted);
        font-weight: 500;
      }
      #paper .home-contact {
        margin: 0 0 22px;
        font: 14px/1.5 var(--mono);
      }
      #paper .home-contact-separator {
        color: var(--muted);
      }
      #paper .home-contact a,
      #paper .home-earlier a {
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: var(--line-strong);
        text-underline-offset: 3px;
      }
      #paper .home-contact a:hover,
      #paper .home-earlier a:hover {
        text-decoration-color: var(--ink);
      }
      #paper .home-start {
        display: inline-block;
        padding: 10px 16px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        font: 600 14px var(--sans);
        text-decoration: none;
      }
      #paper .home-start:hover {
        background: transparent;
        color: var(--ink);
      }
      #paper .home-contents {
        margin: 0 0 8px;
        padding: 0;
        list-style: none;
      }
      #paper .home-contents a {
        display: grid;
        grid-template-columns: 26px 1fr;
        column-gap: 10px;
        padding: 9px 8px;
        border-top: 1px solid var(--line);
        color: var(--ink);
        text-decoration: none;
      }
      #paper .home-contents li:last-child a {
        border-bottom: 1px solid var(--line);
      }
      #paper .home-contents a:hover {
        background: var(--plate);
      }
      #paper .home-chapter-number {
        grid-row: span 2;
        color: var(--muted);
        font: 13px/1.6 var(--mono);
      }
      #paper .home-chapter-title {
        font: 600 16.5px/1.4 var(--serif);
      }
      #paper .home-chapter-summary {
        color: var(--muted);
        font: 13.5px/1.45 var(--sans);
      }
      #paper .home-earlier {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #paper .home-earlier li {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        align-items: baseline;
        padding: 6px 0;
      }
      #paper .home-earlier-note {
        color: var(--muted);
        font: 13.5px/1.45 var(--sans);
      }

      /* Parameters. */
      #panel-column {
        grid-area: panel;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-left: 1px solid var(--line);
        background: var(--panel);
      }
      #panel-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 36px;
        padding: 0 8px 0 12px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font: 650 11px var(--sans);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #panel-toggle {
        padding: 3px 8px;
        border: 1px solid var(--line-strong);
        background: var(--paper);
        color: var(--ink-soft);
        font: 500 12px var(--sans);
        cursor: pointer;
      }
      #panel-note {
        margin: 0;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        color: var(--ink-soft);
        font: 12.5px/1.5 var(--sans);
      }
      #panel-note b {
        color: var(--ink);
      }
      #app[data-panel-collapsed="1"] #panel-bar {
        justify-content: center;
        padding: 0;
      }
      #app[data-panel-collapsed="1"] :is(#panel-bar-title, #panel-note, #panel-holder) {
        display: none;
      }
      #panel-holder {
        flex: 1;
        min-height: 0;
        padding-bottom: 160px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
      #panel-holder > .tp-rotv {
        position: relative;
        width: 100%;
        font-size: 12px;
        --tp-base-background-color: var(--panel);
        --tp-base-border-radius: 0;
        --tp-base-font-family: var(--mono);
        --tp-base-shadow-color: transparent;
        --tp-blade-border-radius: 2px;
        --tp-container-unit-size: 22px;
        --tp-blade-value-width: 150px;
        --tp-button-background-color: #e6e0d3;
        --tp-button-background-color-active: #d6cfbf;
        --tp-button-background-color-focus: #ded8ca;
        --tp-button-background-color-hover: #ded8ca;
        --tp-button-foreground-color: var(--ink);
        --tp-container-background-color: #e9e4d8;
        --tp-container-background-color-active: #dbd4c5;
        --tp-container-background-color-focus: #e1dbce;
        --tp-container-background-color-hover: #e3ddd0;
        --tp-container-foreground-color: var(--ink-soft);
        --tp-groove-foreground-color: #d4ccbb;
        --tp-input-background-color: var(--paper);
        --tp-input-background-color-active: #eee9df;
        --tp-input-background-color-focus: #f1ede4;
        --tp-input-background-color-hover: #f4f0e8;
        --tp-input-foreground-color: var(--ink);
        --tp-label-foreground-color: #5e5a52;
        --tp-monitor-background-color: var(--paper);
        --tp-monitor-foreground-color: var(--ink-soft);
      }
      /* The root pane is only a container here; its own title bar is the
         column's header. */
      #panel-holder > .tp-rotv > .tp-rotv_b {
        display: none;
      }
      /* Run controls are not part of the model: always open, set in grey. */
      #panel-holder .tp-fldv.is-run > .tp-fldv_b {
        background: #dcd5c6;
        pointer-events: none;
      }
      #panel-holder .tp-fldv.is-run > .tp-fldv_b .tp-fldv_m {
        display: none;
      }
      #panel-holder .tp-fldv.is-run > .tp-fldv_c {
        background: var(--run-grey);
      }
      /* The school editor takes the school's own color, strongly enough to
         tell at a glance whose numbers these are; it follows color edits. */
      #panel-holder .tp-fldv.school-editor > .tp-fldv_b {
        box-shadow:
          inset 5px 0 0 var(--school-color),
          inset 0 -3px 0 var(--school-color);
        background: color-mix(in srgb, var(--school-color) 45%, #e9e4d8);
        color: var(--ink);
        font-weight: 700;
      }
      #panel-holder .tp-fldv.school-editor > .tp-fldv_c {
        box-shadow: inset 5px 0 0 color-mix(in srgb, var(--school-color) 60%, transparent);
        background: color-mix(in srgb, var(--school-color) 16%, var(--panel));
      }
      /* A folder holding what this tier adds takes its mechanism's color. */
      #panel-holder .tp-fldv.has-mech > .tp-fldv_b {
        box-shadow: inset 3px 0 0 var(--mech-color);
      }
      #panel-holder .tp-fldv.has-mech > .tp-fldv_b .tp-fldv_t {
        color: var(--mech-color);
        font-weight: 650;
      }
      /* Parameters this tier adds: bold and a size up. A folder holding one is
         bold too, so it still shows when collapsed. */
      #panel-holder .is-new .tp-lblv_l,
      #panel-holder .is-new.tp-btnv .tp-btnv_t,
      #panel-holder .has-new > .tp-fldv_b .tp-fldv_t {
        font-weight: 700;
      }
      #panel-holder .is-new .tp-lblv_l,
      #panel-holder .is-new.tp-btnv .tp-btnv_t {
        color: var(--ink);
        font-size: 1.1em;
      }
      /* Pin: a pinned folder stays open while another one opens. */
      #panel-holder .tp-fldv.has-pin {
        position: relative;
      }
      #panel-holder .fold-pin {
        position: absolute;
        top: 0;
        right: 24px;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 22px;
        height: var(--tp-container-unit-size, 22px);
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        opacity: 0;
      }
      #panel-holder .tp-fldv.has-pin > .tp-fldv_b:hover ~ .fold-pin,
      #panel-holder .fold-pin:hover,
      #panel-holder .fold-pin:focus-visible,
      #panel-holder .tp-fldv.is-pinned > .fold-pin {
        opacity: 1;
      }
      #panel-holder .tp-fldv.is-pinned > .fold-pin {
        color: var(--ink);
      }
      #panel-holder .fold-pin svg {
        width: 12px;
        height: 12px;
      }
      #panel-holder .tp-fldv.is-pinned > .fold-pin svg path {
        fill: currentColor;
      }
      /* The row a formula symbol points at. */
      #panel-holder .is-target {
        background: rgba(20, 20, 19, 0.05);
        box-shadow: inset 3px 0 0 var(--mech-color, var(--ink));
      }
      #panel-holder .is-target .tp-lblv_l {
        color: var(--mech-color, var(--ink));
        font-weight: 700;
      }
      /* Rows that draw something in the tank: a hollow dot in the visual's
         color; click the name to show it, and the row takes the color. */
      #panel-holder .vis-row .tp-lblv_l {
        cursor: pointer;
      }
      #panel-holder .vis-row .tp-lblv_l::before {
        display: inline-block;
        box-sizing: border-box;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border: 1.5px solid var(--vis-color);
        border-radius: 50%;
        vertical-align: 0;
        content: "";
      }
      /* Color only, not bold: bold marks what a tier adds. */
      #panel-holder .vis-row.vis-on .tp-lblv_l {
        color: var(--vis-color);
      }
      #panel-holder .vis-row.vis-on .tp-lblv_l::before {
        background: var(--vis-color);
      }
      .param-btn {
        appearance: none;
        margin-left: 5px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1;
        cursor: pointer;
        opacity: 0.55;
        user-select: none;
      }
      .param-btn:hover,
      .param-btn:focus-visible {
        opacity: 1;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ink-soft);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <a class="brand" href="/" data-route>flocks</a>
        <nav id="tier-nav" aria-label="Tiers">
          <button id="tier-prev" class="edge" type="button">← Previous</button>
          <ol id="tier-steps"></ol>
          <button id="tier-next" class="edge" type="button">Next →</button>
        </nav>
      </header>
      <article id="paper" aria-label="About this tier"></article>
      <div id="paper-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the text column" title="Drag to resize · double-click to reset"></div>
      <main id="stage">
        <button id="lab-reset" type="button" hidden>Reset fish</button>
        <div id="startup-status" role="status" aria-live="polite">Starting simulation…</div>
      </main>
      <aside id="panel-column" aria-label="Simulation parameters">
        <div id="panel-bar">
          <span id="panel-bar-title">Parameters</span>
          <button id="panel-toggle" type="button" aria-expanded="true">Hide ›</button>
        </div>
        <p id="panel-note"></p>
        <div id="panel-holder"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
